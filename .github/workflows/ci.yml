name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU 版 torch（CI 无 GPU，模型单测均用随机小输入在 CPU 跑）
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Ruff lint
        run: |
          # 钉版：ruff 0.17.0（= environment.yml 实测版本），避免新版规则集
          # 让"既有 32 条 lint 债务"的判定随上游漂移（V5 已清本波新增；全量清零排程中）
          pip install ruff==0.17.0
          ruff check core exp tools scripts tests

      - name: Pytest
        run: |
          python -m pytest tests -q --tb=line 2>&1 | tee pytest_out.txt || true
          grep -E "^(FAILED|ERROR)" pytest_out.txt | while IFS= read -r line; do
            echo "::error::${line}"
          done || true
          grep -qE "^[0-9]+ passed" pytest_out.txt && ! grep -qE " [1-9][0-9]* failed" pytest_out.txt && exit 0 || exit 1
