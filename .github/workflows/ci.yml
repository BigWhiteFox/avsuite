name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU 版 torch（CI 无 GPU，模型单测均用随机小输入在 CPU 跑）
          # torch/numpy/scipy/soundfile 按 environment.yml 实测版钉死：golden 波形
          # sha256 逐位基准对 float 合成依赖版本敏感（见 tests/golden/），不钉版会在
          # CI 新版本上产生 ULP 级漂移导致假失败（2026-10-15 run#16 实证）
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install numpy==1.26.4 scipy==1.17.1 soundfile==0.14.0
          pip install -r requirements.txt
          # 兜底：requirements 的宽松下界可能再次抬升已钉版本，重申一遍
          pip install numpy==1.26.4 scipy==1.17.1 soundfile==0.14.0

      - name: Ruff lint
        run: |
          # 钉版：ruff 0.17.0（= environment.yml 实测版本），避免新版规则集
          # 让"既有 32 条 lint 债务"的判定随上游漂移（V5 已清本波新增；全量清零排程中）
          pip install ruff==0.17.0
          ruff check core exp tools scripts tests

      - name: Pytest (shard 1/2, test_[a-m]*.py)
        run: |
          python -m pytest tests/test_[a-m]*.py -q --tb=short 2>&1 | tee pytest_out_1.txt || true
          tail -n 25 pytest_out_1.txt | while IFS= read -r line; do echo "::error::s1 ${line}"; done || true
          grep -qE "[0-9]+ passed" pytest_out_1.txt && ! grep -qE "[1-9][0-9]* failed" pytest_out_1.txt || exit 1

      - name: Pytest (shard 2/2, test_[n-z]*.py)
        run: |
          python -m pytest tests/test_[n-z]*.py -q --tb=short 2>&1 | tee pytest_out_2.txt || true
          tail -n 25 pytest_out_2.txt | while IFS= read -r line; do echo "::error::s2 ${line}"; done || true
          grep -qE "[0-9]+ passed" pytest_out_2.txt && ! grep -qE "[1-9][0-9]* failed" pytest_out_2.txt || exit 1
