name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU 版 torch（CI 无 GPU，模型单测均用随机小输入在 CPU 跑）
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Ruff lint
        run: |
          pip install ruff
          ruff check core exp tools scripts tests

      - name: Pytest
        run: |
          set -o pipefail
          python -m pytest tests -q 2>&1 | tee pytest_out.txt
