name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU 版 torch（CI 无 GPU，模型单测均用随机小输入在 CPU 跑）
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Ruff lint
        run: |
          pip install ruff
          ruff check core exp tools scripts tests

      - name: Pytest
        run: |
          set -o pipefail
          python -m pytest tests -q 2>&1 | tee pytest_out.txt

      # 临时调试：失败时把 pytest 输出推到 ci-debug-log 分支（raw 公开可读，便于无 logs API 权限时取日志）
      - name: Dump pytest log to ci-debug-log branch
        if: failure()
        run: |
          git config user.name "ci-log-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B ci-debug-log
          git add pytest_out.txt
          git commit -m "ci debug: pytest log [skip ci]"
          git push --force origin ci-debug-log
